name: CI/CD Pipeline — VitalSync

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances
        working-directory: backend
        run: npm ci

      - name: Exécution des tests Jest
        working-directory: backend
        run: npm test

      - name: Lint ESLint
        working-directory: backend
        run: npx eslint . --ext .js --max-warnings 0

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vitalsync-backend:sha-${{ github.sha }}

          target: production

      - name: Build & Push image Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vitalsync-frontend:sha-${{ github.sha }}

  deploy-staging:
    name: Deploy Staging & Health Check
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Créer le fichier .env de staging
        run: |
          echo "POSTGRES_DB=${{ secrets.STAGING_POSTGRES_DB }}" >> .env
          echo "POSTGRES_USER=${{ secrets.STAGING_POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}" >> .env
          echo "NODE_ENV=staging" >> .env
          echo "PORT=3000" >> .env

      - name: Démarrage des services
        run: |
          docker compose up -d --build
          sleep 15

      - name: Health Check du back-end
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check échoué"
            docker compose logs backend
            exit 1
          fi
          echo "Health check réussi"

      - name: Arrêt des services
        if: always()
        run: docker compose down -v
